version: '3.8'

services:
  db:
    image: 'postgres:13-alpine'
    environment:
      POSTGRES_DB: studybuddy
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  chroma:
    image: 'ghcr.io/chroma-core/chroma:latest'
    volumes:
      - chroma_data:/chroma_data
    ports:
      - "8000:8000"

volumes:
  db_data:
  chroma_data:
